name: CAPA
version: $SERVICE_TAG
description: This service uses the CAPA open source library to identify what the program at hand could do.

# Regex defining the types of files the service accepts and rejects
accepts: executable/windows/.*
rejects: empty|metadata/.*|executable/windows/dos|executable/windows/com

# At which stage the service should run (one of FILTER, EXTRACT, CORE, SECONDARY, POST, REVIEW)
# NOTE: Stages are executed in the order defined in the list
stage: CORE
# Which category the service is part of (one of Antivirus, Dynamic Analysis, External, Extraction, Filtering, Internet Connected, Networking, Static Analysis)
category: Static Analysis

# Does the service require access to the file to perform its task
# If set to false, the service will only have access to the file metadata (e.g. Hashes, size, type, ...)
file_required: true
# Maximum execution time the service has before it's considered to be timed out
timeout: 300

# is the service enabled by default
enabled: true
privileged: true

config:
  # Skip files larger than this (bytes). Capa/vivisect cost scales poorly with size.
  max_file_size: 512000
  # Soft address-space cap (MiB) for the per-file analysis subprocess. When unset,
  # derived from the container cgroup limit (limit minus headroom) so a pathological
  # sample fails soft inside the child instead of OOMKilling the pod.
  # analysis_memory_mb: 12288
  # Wall-clock timeout (seconds) for a single analysis subprocess. Keep below the
  # service timeout so the parent can return a soft error instead of being preempted.
  analysis_timeout: 240

submission_params:
  - default: "default"
    name: renderer
    type: list
    value: "default"
    list: ["default", "simple", "verbose"]

heuristics:
  - description: CAPA found a matching signature
    filetype: "executable/windows"
    heur_id: 1
    name: Signature Found
    score: 0

docker_config:
  image: ${REGISTRY}cccs/assemblyline-service-capa:$SERVICE_TAG
  cpu_cores: 1
  ram_mb_min: 3078
  ram_mb: 4096
